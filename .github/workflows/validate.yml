name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, lazyarb, infra, staging]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24.11"
          cache: true
      - name: Verify source and tests
        run: make verify
      - name: Validate installer
        run: |
          sh -n install-runtime.sh
          scripts/test-install-runtime.sh
      - name: Build hardened image
        run: docker build --build-arg VERSION=ci --build-arg COMMIT="$GITHUB_SHA" -t lazyarb/keitaro-worker:ci .
      - name: Smoke-test image
        run: docker run --rm --entrypoint /usr/local/bin/keitaro-worker lazyarb/keitaro-worker:ci version
