name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, lazyarb, infra, staging]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.11"
          cache: false
      - name: Validate release tag
        run: |
          set -euo pipefail
          test "v$(tr -d '[:space:]' < VERSION)" = "$GITHUB_REF_NAME"
          make verify
          scripts/test-install-runtime.sh
      - name: Build release binaries
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X main.version=$version -X main.commit=$GITHUB_SHA" \
              -o "dist/keitaro-worker-linux-$arch" ./cmd/keitaro-worker
          done
          (cd dist && sha256sum keitaro-worker-linux-* > SHA256SUMS)
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign checksums
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle dist/SHA256SUMS.bundle dist/SHA256SUMS
      - name: Publish GitHub release
        uses: softprops/action-gh-release@6cbd405e2c4e67a21c47fa9e383d020e4e28b836 # v2.3.3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/keitaro-worker-linux-amd64
            dist/keitaro-worker-linux-arm64
            dist/SHA256SUMS
            dist/SHA256SUMS.bundle
