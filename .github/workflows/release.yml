name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, lazyarb, infra, staging]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.11"
          cache: false
      - name: Validate release tag
        run: |
          set -euo pipefail
          test "v$(tr -d '[:space:]' < VERSION)" = "$GITHUB_REF_NAME"
          make verify
          scripts/test-install-runtime.sh
      - name: Build release binaries
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X main.version=$version -X main.commit=$GITHUB_SHA" \
              -o "dist/keitaro-worker-linux-$arch" ./cmd/keitaro-worker
          done
          (cd dist && sha256sum keitaro-worker-linux-* > SHA256SUMS)
      - name: Build and publish multi-architecture image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /run/lazyarb-runner
          exec 9>/run/lazyarb-runner/docker-build.lock
          flock -w 300 9
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          version="${GITHUB_REF_NAME#v}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=$version" \
            --build-arg "COMMIT=$GITHUB_SHA" \
            --tag "ghcr.io/lazyarb/keitaro-worker:$version" \
            --tag "ghcr.io/lazyarb/keitaro-worker:$GITHUB_SHA" \
            --provenance=mode=max \
            --sbom=true \
            --metadata-file dist/image-metadata.json \
            --push .
          jq -r '."containerimage.digest"' dist/image-metadata.json > dist/IMAGE_DIGEST
      - name: Sign image
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          go install github.com/sigstore/cosign/v2/cmd/cosign@v2.6.1
          digest=$(cat dist/IMAGE_DIGEST)
          "$(go env GOPATH)/bin/cosign" sign "ghcr.io/lazyarb/keitaro-worker@$digest"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/keitaro-worker-linux-* dist/SHA256SUMS dist/IMAGE_DIGEST --verify-tag --generate-notes
